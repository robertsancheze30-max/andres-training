<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrés Training · Panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="display" style="font-size:24px;">PANEL<br>ANDRÉS</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="alumnos" onclick="switchTab('alumnos')">Alumnos</div>
    <div class="tab" data-tab="agenda" onclick="switchTab('agenda')">Agenda</div>
    <div class="tab" data-tab="progreso" onclick="switchTab('progreso')">Progreso</div>
  </div>

  <!-- ALUMNOS -->
  <div id="tab-alumnos">
    <div class="plate">
      <div class="label" style="margin-bottom:8px;">Nuevo alumno</div>
      <input id="new-student-name" placeholder="Nombre">
      <input id="new-student-phone" placeholder="Teléfono (opcional)">
      <button onclick="addStudent()">Agregar alumno</button>
    </div>
    <div id="students-list"></div>
  </div>

  <!-- AGENDA -->
  <div id="tab-agenda" class="hidden">
    <div class="plate">
      <div class="label" style="margin-bottom:8px;">Nueva clase</div>
      <select id="class-student-select"><option value="">Selecciona alumno</option></select>
      <div class="field-wrap">
        <input id="class-date" type="date" oninput="toggleFieldLabel(this)">
        <span class="field-placeholder">Fecha</span>
      </div>
      <div class="field-wrap">
        <input id="class-time" type="time" oninput="toggleFieldLabel(this)">
        <span class="field-placeholder">Hora</span>
      </div>
      <button onclick="addClass()">Agendar clase</button>
    </div>
    <div id="classes-admin-list"></div>
  </div>

  <!-- PROGRESO -->
  <div id="tab-progreso" class="hidden">
    <div class="plate">
      <select id="progress-student-select" onchange="loadProgressForStudent()"><option value="">Selecciona alumno</option></select>
    </div>
    <div class="plate">
      <div class="label" style="margin-bottom:8px;">Nuevo registro</div>
      <div class="field-wrap">
        <input id="progress-date" type="date" oninput="toggleFieldLabel(this)">
        <span class="field-placeholder">Fecha</span>
      </div>
      <input id="progress-weight" type="number" step="0.1" placeholder="Peso (kg)">
      <input id="progress-chest" type="number" step="0.1" placeholder="Pecho (cm) - opcional">
      <input id="progress-waist" type="number" step="0.1" placeholder="Cintura (cm) - opcional">
      <input id="progress-arm" type="number" step="0.1" placeholder="Brazo (cm) - opcional">
      <textarea id="progress-notes" placeholder="Notas (opcional)" rows="2"></textarea>
      <button onclick="addProgress()">Guardar registro</button>
    </div>
    <div id="progress-admin-list"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let studentsCache = {};

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  ['alumnos','agenda','progreso'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
}

function toggleFieldLabel(input){
  const placeholder = input.nextElementSibling;
  if(input.value){
    placeholder.classList.add('hidden');
  } else {
    placeholder.classList.remove('hidden');
  }
}

function genCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function addStudent(){
  const name = document.getElementById('new-student-name').value.trim();
  const phone = document.getElementById('new-student-phone').value.trim();
  if(!name) return;
  const code = genCode();
  db.ref('students').push({name, phone, code}).then(()=>{
    document.getElementById('new-student-name').value = '';
    document.getElementById('new-student-phone').value = '';
  });
}

function deleteStudent(id){
  if(!confirm('¿Eliminar este alumno? También se pierde su historial de progreso.')) return;
  db.ref('students/'+id).remove();
  db.ref('progress/'+id).remove();
}

db.ref('students').on('value', snap=>{
  studentsCache = snap.val() || {};
  renderStudents();
  renderStudentSelects();
});

function renderStudents(){
  const list = document.getElementById('students-list');
  const ids = Object.keys(studentsCache);
  if(ids.length===0){
    list.innerHTML = '<div class="plate"><div class="empty">Sin alumnos todavía.</div></div>';
    return;
  }
  list.innerHTML = '<div class="plate">' + ids.map(id=>{
    const s = studentsCache[id];
    return `
      <div class="item">
        <div>
          <div class="name">${s.name}</div>
          <div class="meta">Código: ${s.code}${s.phone ? ' · '+s.phone : ''}</div>
        </div>
        <button class="danger" style="width:auto;padding:8px 12px;font-size:12px;" onclick="deleteStudent('${id}')">Eliminar</button>
      </div>
    `;
  }).join('') + '</div>';
}

function renderStudentSelects(){
  const opts = '<option value="">Selecciona alumno</option>' + Object.keys(studentsCache).map(id=>
    `<option value="${id}">${studentsCache[id].name}</option>`
  ).join('');
  document.getElementById('class-student-select').innerHTML = opts;
  document.getElementById('progress-student-select').innerHTML = opts;
}

// AGENDA
function addClass(){
  const studentId = document.getElementById('class-student-select').value;
  const date = document.getElementById('class-date').value;
  const time = document.getElementById('class-time').value;
  if(!studentId || !date || !time) return;
  db.ref('classes').push({studentId, date, time, status:'pendiente'}).then(()=>{
    document.getElementById('class-date').value = '';
    document.getElementById('class-time').value = '';
    toggleFieldLabel(document.getElementById('class-date'));
    toggleFieldLabel(document.getElementById('class-time'));
  });
}

function setClassStatus(id, status){
  db.ref('classes/'+id).update({status});
}

function deleteClass(id){
  db.ref('classes/'+id).remove();
}

db.ref('classes').on('value', snap=>{
  const list = document.getElementById('classes-admin-list');
  if(!snap.exists()){
    list.innerHTML = '<div class="plate"><div class="empty">Sin clases agendadas.</div></div>';
    return;
  }
  const classes = Object.entries(snap.val()).map(([id,c])=>({id,...c}))
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  list.innerHTML = '<div class="plate">' + classes.map(c=>{
    const name = studentsCache[c.studentId] ? studentsCache[c.studentId].name : '(alumno eliminado)';
    return `
      <div class="item">
        <div>
          <div class="name">${name}</div>
          <div class="meta">${formatDate(c.date)} · ${c.time} · <span class="status-${c.status}">${c.status}</span></div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="secondary" style="width:auto;padding:8px 10px;font-size:12px;" onclick="setClassStatus('${c.id}','completada')">✓</button>
          <button class="danger" style="width:auto;padding:8px 10px;font-size:12px;" onclick="deleteClass('${c.id}')">✕</button>
        </div>
      </div>
    `;
  }).join('') + '</div>';
});

// PROGRESO
function loadProgressForStudent(){
  const studentId = document.getElementById('progress-student-select').value;
  const list = document.getElementById('progress-admin-list');
  if(!studentId){ list.innerHTML=''; return; }
  db.ref('progress/'+studentId).on('value', snap=>{
    if(!snap.exists()){
      list.innerHTML = '<div class="plate"><div class="empty">Sin registros para este alumno.</div></div>';
      return;
    }
    const records = Object.values(snap.val()).sort((a,b)=> b.date.localeCompare(a.date));
    list.innerHTML = '<div class="plate">' + records.map(r=>`
      <div class="item">
        <div>
          <div class="name">${formatDate(r.date)} · ${r.weight} kg</div>
          <div class="meta">${[r.chest&&'Pecho '+r.chest+'cm', r.waist&&'Cintura '+r.waist+'cm', r.arm&&'Brazo '+r.arm+'cm'].filter(Boolean).join(' · ')}</div>
          ${r.notes ? '<div class="meta">"'+r.notes+'"</div>' : ''}
        </div>
      </div>
    `).join('') + '</div>';
  });
}

function addProgress(){
  const studentId = document.getElementById('progress-student-select').value;
  const date = document.getElementById('progress-date').value;
  const weight = document.getElementById('progress-weight').value;
  if(!studentId || !date || !weight) return;
  const record = {
    date, weight: parseFloat(weight),
    chest: document.getElementById('progress-chest').value ? parseFloat(document.getElementById('progress-chest').value) : null,
    waist: document.getElementById('progress-waist').value ? parseFloat(document.getElementById('progress-waist').value) : null,
    arm: document.getElementById('progress-arm').value ? parseFloat(document.getElementById('progress-arm').value) : null,
    notes: document.getElementById('progress-notes').value || null
  };
  db.ref('progress/'+studentId).push(record).then(()=>{
    document.getElementById('progress-date').value = '';
    toggleFieldLabel(document.getElementById('progress-date'));
    document.getElementById('progress-weight').value = '';
    document.getElementById('progress-chest').value = '';
    document.getElementById('progress-waist').value = '';
    document.getElementById('progress-arm').value = '';
    document.getElementById('progress-notes').value = '';
  });
}

function formatDate(d){
  const [y,m,day] = d.split('-');
  return day+'/'+m+'/'+y;
}
</script>
</body>
</html>
